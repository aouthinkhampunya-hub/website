<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - ລາຍການຈອງ</title>
<style>
  :root{
    --accent:#e10600;
    --accent2:#ff2d2d;
    --bg:#0d0d0d;
    --card:#161616;
    --text:#f1f1f1;
    --muted:#9ca3af;
    --border:#2a2a2a;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif;}
  body{background:var(--bg);color:var(--text);padding:24px;}
  h1{font-size:26px;margin-bottom:6px;border-left:5px solid var(--accent);padding-left:12px;}
  p.sub{color:var(--muted);margin-bottom:24px;padding-left:17px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .count-badge{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:8px;font-size:14px;}
  .count-badge b{color:var(--accent2);}
  .refresh-btn{
    background:var(--accent);color:#fff;border:none;padding:10px 18px;
    border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;
  }
  .refresh-btn:hover{background:var(--accent2);}

  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;}
  th, td{padding:12px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--border);}
  th{background:#0f0f0f;color:var(--accent2);font-size:13px;text-transform:uppercase;}
  tr:hover{background:#1c1c1c;}
  td.muted{color:var(--muted);}

  .del-btn{
    background:transparent;border:1px solid var(--accent);color:var(--accent2);
    padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;
  }
  .del-btn:hover{background:var(--accent);color:#fff;}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);}

  @media(max-width:800px){
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tr{background:var(--card);margin-bottom:12px;border-radius:10px;padding:10px;border:1px solid var(--border);}
    td{border:none;padding:6px 4px;display:flex;justify-content:space-between;}
    td::before{content:attr(data-label);color:var(--muted);font-weight:600;}
  }
</style>
</head>
<body>

  <h1>📋 ລາຍການຈອງເບິ່ງລົດ</h1>
  <p class="sub">ຂໍ້ມູນລູກຄ້າທີ່ຈອງຜ່ານໜ້າເວັບ</p>

  <div class="toolbar">
    <div class="count-badge">ທັງໝົດ: <b id="totalCount">0</b> ລາຍການ</div>
    <button class="refresh-btn" onclick="loadBookings()">🔄 ໂຫຼດຂໍ້ມູນໃໝ່</button>
  </div>

  <table id="bookingTable">
    <thead>
      <tr>
        <th>ຊື່</th>
        <th>ເບີໂທ</th>
        <th>ລົດທີ່ສົນໃຈ</th>
        <th>ວັນທີ່ນັດ</th>
        <th>ຂໍ້ຄວາມ</th>
        <th>ວັນທີ່ຈອງ</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="bookingBody"></tbody>
  </table>

  <div class="empty" id="emptyState" style="display:none;">ຍັງບໍ່ມີລາຍການຈອງເທື່ອ</div>

<script>
async function loadBookings(){
  const res = await fetch('/api/bookings');
  const bookings = await res.json();

  const tbody = document.getElementById('bookingBody');
  const table = document.getElementById('bookingTable');
  const empty = document.getElementById('emptyState');

  document.getElementById('totalCount').textContent = bookings.length;

  if(bookings.length === 0){
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  table.style.display = 'table';
  empty.style.display = 'none';

  tbody.innerHTML = bookings.map(b => `
    <tr>
      <td data-label="ຊື່">${b.name}</td>
      <td data-label="ເບີໂທ">${b.phone}</td>
      <td data-label="ລົດ">${b.car}</td>
      <td data-label="ວັນນັດ">${b.date}</td>
      <td data-label="ຂໍ້ຄວາມ" class="muted">${b.message}</td>
      <td data-label="ວັນທີ່ຈອງ" class="muted">${new Date(b.createdAt).toLocaleString('lo-LA')}</td>
      <td><button class="del-btn" onclick="deleteBooking(${b.id})">ລຶບ</button></td>
    </tr>
  `).join('');
}

async function deleteBooking(id){
  if(!confirm('ຢືນຢັນລຶບລາຍການນີ້?')) return;
  await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
  loadBookings();
}

loadBookings();
</script>

</body>
</html>
